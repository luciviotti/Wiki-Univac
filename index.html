<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Ayuda | Univac.ERP</title>
<meta name="description" content="Centro de Ayuda oficial de Univac.ERP: guías, procedimientos y respuestas basadas en la documentación oficial.">
<link rel="icon" type="image/png" href="assets/favicon_univac.png">
<link rel="preload" href="assets/fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
<script>try{if(sessionStorage.getItem('splashVisto'))document.documentElement.classList.add('no-splash')}catch(e){}</script>
<link rel="preload" href="assets/splash/u.png" as="image">
<style>
/* Centro de Ayuda Univac.ERP — tipografía exclusiva: Poppins */
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --navy:#202850; --navy-2:#2e3a6e; --red:#e03028; --blue:#4068b0; --sky:#68b0e0;
  --ink:#1d2340; --text:#3a4060; --muted:#6b7190; --line:#e3e6ef; --line-2:#eef0f6;
  --bg:#ffffff; --soft:#f6f7fb; --blue-soft:#eef3fb; --red-soft:#fdf0ef; --amber-soft:#fff7e8; --amber:#a86a00;
  --radius:8px; --side:272px; --top:68px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 16px)}
html{font-family:'Poppins'}
body{margin:0;font-family:'Poppins';font-size:15px;line-height:1.65;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:'Poppins';font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{color:var(--ink);line-height:1.3;margin:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:6px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);height:var(--top)}
.topbar-in{height:100%;display:flex;align-items:center;gap:20px;padding:0 24px;max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;color:var(--navy);flex-shrink:0}
.brand:hover{text-decoration:none}
.brand-logo{height:38px;width:auto;display:block}
.brand-sep{width:1px;height:28px;background:var(--line)}
.brand-txt{font-weight:500;font-size:15px;color:var(--navy);letter-spacing:.01em}
.top-search{flex:1;max-width:560px;margin-left:auto;position:relative}
.top-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.top-search input{width:100%;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px 0 40px;background:var(--soft);font-size:14px}
.top-search input:focus{outline:none;border-color:var(--blue);background:#fff}
.top-links{display:flex;gap:8px}
.btn-assist{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--navy);color:#fff;font-weight:500;font-size:14px}
.btn-assist:hover{background:var(--navy-2);text-decoration:none}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:8px;display:none;align-items:center;justify-content:center;color:var(--navy);cursor:pointer}
.icon-btn:hover{background:var(--soft)}

/* Estructura */
.layout{display:flex;max-width:1600px;margin:0 auto;min-height:calc(100vh - var(--top))}
.sidebar{width:var(--side);flex-shrink:0;border-right:1px solid var(--line);position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;padding:22px 14px 22px 18px;background:#fff}
.side-head{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px 10px}
.side-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--text);font-size:14px}
.side-cat:hover{background:var(--soft);text-decoration:none}
.side-cat.on{background:var(--blue-soft);color:var(--navy);font-weight:500}
.side-cat .n{font-size:12px;color:var(--muted)}
.side-foot{margin-top:18px;padding:16px 10px 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;font-size:13px}
.side-foot a{color:var(--muted)}
.main{flex:1;min-width:0;padding:36px 48px 64px}
.main:focus{outline:none}
.scrim{position:fixed;inset:var(--top) 0 0 0;background:rgba(32,40,80,.35);z-index:30}

/* Inicio */
.hero{padding:28px 0 36px;border-bottom:1px solid var(--line-2);margin-bottom:36px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.hero h1{font-size:34px;font-weight:600;margin-bottom:8px}
.hero p{margin:0 0 24px;color:var(--muted);max-width:640px}
.big-search{display:flex;max-width:720px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.big-search:focus-within{border-color:var(--blue)}
.big-search input{flex:1;border:0;padding:0 18px;height:56px;font-size:16px;min-width:0}
.big-search input:focus{outline:none}
.big-search button{border:0;background:var(--navy);color:#fff;padding:0 26px;font-weight:500;cursor:pointer}
.big-search button:hover{background:var(--navy-2)}
.examples{margin-top:14px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#fff;color:var(--text);font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:44px}
.cat-item{display:block;padding:22px 22px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--text)}
.cat-item:hover{background:var(--soft);text-decoration:none}
.cat-item h3{font-size:16px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.cat-item h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--blue)}
.cat-item:nth-child(3n+2) h3::before{background:var(--red)}
.cat-item:nth-child(3n) h3::before{background:var(--sky)}
.cat-item p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.cat-item .count{font-size:12px;color:var(--blue);font-weight:500}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}
.faq-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.faq-list li{border-bottom:1px solid var(--line)}
.faq-list a{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;color:var(--ink);font-weight:500;font-size:14.5px}
.faq-list a::after{content:"›";color:var(--muted);font-size:18px;line-height:1}
.faq-list a:hover{color:var(--blue);text-decoration:none}
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h3{font-size:17px;margin-bottom:8px}
.panel p{margin:0 0 14px;font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:500;font-size:14px;cursor:pointer}
.btn:hover{background:var(--navy-2);text-decoration:none}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy)}

/* Migas y encabezados */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--blue)}
.crumbs span.sep{opacity:.5}
.page-h{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line-2)}
.page-h h1{font-size:28px;font-weight:600;margin-bottom:6px}
.page-h p{margin:0;color:var(--muted)}

/* Categoría */
.topic{margin-bottom:34px}
.topic h2{font-size:17px;font-weight:600;margin-bottom:10px;color:var(--navy)}
.art-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.art-list li{border-bottom:1px solid var(--line)}
.art-list a{display:block;padding:13px 4px;color:var(--ink)}
.art-list a:hover{text-decoration:none;background:var(--soft)}
.art-list .t{font-weight:500;font-size:15px;display:block}
.art-list .d{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.tag.res{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.rev{background:var(--amber-soft);color:var(--amber)}

/* Artículo */
.art-wrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:48px;max-width:1180px}
.article h1{font-size:30px;font-weight:600;margin-bottom:12px}
.lead{font-size:16px;color:var(--text);margin:0 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-bottom:24px}
.meta b{font-weight:500;color:var(--text)}
.notice{border-left:3px solid var(--blue);background:var(--blue-soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:14px 0;font-size:14px}
.notice.warn{border-color:#d99400;background:var(--amber-soft)}
.notice.error{border-color:var(--red);background:var(--red-soft)}
.notice.ok,.notice.tip{border-color:#3c9a6a;background:#eef8f2}
.notice .k{font-weight:600;color:var(--ink);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.notice.review{border-color:#d99400;background:var(--amber-soft)}
.a-sec{margin:36px 0 0}
.a-sec>h2{font-size:20px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.sub{margin:18px 0 0}
.sub>h3{font-size:15.5px;font-weight:600;margin-bottom:8px;color:var(--navy);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sub>h3 .src{font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.sub h4{font-size:14.5px;font-weight:600;margin:14px 0 6px}
.sub p{margin:0 0 10px}
.sub ul{margin:0 0 12px;padding-left:20px}
.sub ul li{margin-bottom:4px}
ol.steps{list-style:none;counter-reset:s;margin:0 0 14px;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:2px 0 10px 40px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ui{font-weight:500;color:var(--navy);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:normal}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:6px}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{background:var(--soft);color:var(--ink);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:500;color:var(--ink)}
details.det{border:1px solid var(--line);border-radius:6px;margin:10px 0}
details.det>summary{cursor:pointer;padding:11px 14px;font-weight:500;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary::after{content:"+";color:var(--muted);font-weight:400}
details.det[open]>summary::after{content:"−"}
details.det>summary .src{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto}
details.det>.sub{margin:0;padding:4px 14px 6px;border-top:1px solid var(--line-2)}
.media{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.media-slot{border:1px dashed #cdd2e0;border-radius:6px;padding:18px;font-size:13px;color:var(--muted);background:#fcfcfe}
.media-slot b{display:block;color:var(--text);font-weight:500;margin-bottom:2px}
.media img{max-width:100%;border:1px solid var(--line);border-radius:6px}
.source-box{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:13.5px}
.source-box ul{margin:6px 0 0;padding-left:18px}
.rel-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.rel-list li{border-bottom:1px solid var(--line-2)}
.rel-list a{display:block;padding:10px 0;font-size:14px;font-weight:500}
.toc{position:sticky;top:calc(var(--top) + 28px);align-self:start;font-size:13px}
.toc .h{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.toc a{display:block;color:var(--text);padding:5px 0 5px 12px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--blue);border-color:var(--blue);text-decoration:none}
.feedback{margin-top:40px;padding:18px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:14px}

/* Búsqueda */
.result{padding:16px 0;border-bottom:1px solid var(--line-2)}
.result a.t{font-size:16.5px;font-weight:600;color:var(--ink)}
.result a.t:hover{color:var(--blue)}
.result .path{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.result .snip{font-size:14px;margin:0}
mark{background:#fff1b8;color:inherit;padding:0 1px;border-radius:2px}
.empty{border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:720px}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{margin:0 0 6px;color:var(--muted)}

/* Asistente */
.assist{max-width:860px}
.mode{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:18px}
.mode i{width:8px;height:8px;border-radius:50%;background:#3c9a6a;display:inline-block}
.chat{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chat-log{padding:22px;min-height:260px;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:#fff}
.msg{max-width:100%}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px 14px 4px 14px;max-width:80%}
.msg.bot{align-self:flex-start;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:16px 18px;background:var(--soft);width:100%}
.msg.bot h4{font-size:15px;margin:0 0 6px}
.msg.bot .srcs{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.msg.bot .srcs div{margin-top:2px}
.msg.bot .also{margin-top:10px;font-size:13px}
.chat-form{display:flex;border-top:1px solid var(--line);background:#fff}
.chat-form textarea{flex:1;border:0;resize:none;padding:14px 18px;height:56px;min-width:0}
.chat-form textarea:focus{outline:none}
.chat-form button{border:0;background:var(--navy);color:#fff;padding:0 24px;font-weight:500;cursor:pointer}
.small{font-size:12.5px;color:var(--muted)}
.manual-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14px}

/* Responsive */
@media (max-width:1180px){.art-wrap{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:1024px){
  .icon-btn{display:inline-flex}
  .sidebar{position:fixed;left:0;top:var(--top);z-index:35;transform:translateX(-105%);transition:transform .2s ease;box-shadow:none;border-right:1px solid var(--line)}
  .sidebar.open{transform:none}
  .main{padding:28px 28px 56px}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:720px){
  :root{--top:60px}
  .topbar-in{padding:0 12px;gap:10px}
  .brand-logo{height:30px}
  .brand-sep,.brand-txt{display:none}
  .top-search input{height:38px;font-size:13.5px}
  .btn-assist{padding:0 12px;height:36px;font-size:13px}
  .main{padding:22px 16px 48px}
  .hero h1{font-size:26px}
  .big-search input{height:50px;font-size:15px}
  .big-search button{padding:0 16px}
  .page-h h1,.article h1{font-size:23px}
  .media,.rel-list{grid-template-columns:1fr}
  .sub>h3{flex-direction:column;gap:2px}
  .msg.user{max-width:92%}
  .chat-log{padding:14px}
}
@media (max-width:420px){.top-links{display:none}}
@media print{.topbar,.sidebar,.toc,.footer,.feedback{display:none}.main{padding:0}}
.footer{border-top:1px solid var(--line);background:var(--soft)}
.footer-in{max-width:1600px;margin:0 auto;padding:24px;display:flex;gap:20px;align-items:center;font-size:13px;color:var(--muted)}
.footer-in p{margin:0}
.footer-logo{height:30px;width:auto}
@media (max-width:720px){.footer-in{flex-direction:column;align-items:flex-start}}

/* ===== Splash de bienvenida ===== */
.splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;transition:opacity .55s ease,visibility .55s ease}
.splash.out{opacity:0;visibility:hidden}
.splash.out .splash-logo{transform:scale(1.12)}
.no-splash .splash{display:none}
.splash-logo{position:relative;width:min(46vmin,340px);aspect-ratio:942/968;transition:transform .55s ease}
.splash-logo img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.sp-u{opacity:0;transform:scale(.55) translateY(24px);transform-origin:50% 60%;animation:spU .85s cubic-bezier(.2,.9,.25,1.15) .15s forwards}
.sp-sq{opacity:0;transform:translate(-26%,34%) scale(.2);transform-origin:50% 50%;animation:spSq .5s cubic-bezier(.2,.9,.3,1.4) forwards}
.sp-sq1{animation-delay:.85s}
.sp-sq2{animation-delay:1s}
.sp-sq3{animation-delay:1.15s}
.sp-sq4{animation-delay:1.3s}
@keyframes spU{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes spSq{to{opacity:1;transform:translate(0,0) scale(1)}}
@media (prefers-reduced-motion:reduce){.splash{display:none}}

/* Bloque "¿No encontraste lo que necesitabas?" */
.feedback{align-items:flex-start;flex-direction:column;gap:12px}
.feedback-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.feedback-btns .btn{justify-content:center;width:100%}

</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-logo">
    <img class="sp-u" src="assets/splash/u.png" alt="">
    <img class="sp-sq sp-sq1" src="assets/splash/sq1.png" alt="">
    <img class="sp-sq sp-sq2" src="assets/splash/sq2.png" alt="">
    <img class="sp-sq sp-sq3" src="assets/splash/sq3.png" alt="">
    <img class="sp-sq sp-sq4" src="assets/splash/sq4.png" alt="">
  </div>
</div>
<script>
(function(){
  var s=document.getElementById('splash');
  if(!s)return;
  if(document.documentElement.classList.contains('no-splash')||window.matchMedia('(prefers-reduced-motion: reduce)').matches){s.remove();return;}
  try{sessionStorage.setItem('splashVisto','1')}catch(e){}
  var done=false;
  function cerrar(){
    if(done)return;done=true;
    s.classList.add('out');
    setTimeout(function(){s.remove()},600);
  }
  setTimeout(cerrar,2300);
  s.addEventListener('click',cerrar);
})();
</script>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="topbar">

{
"id": "flujo-autorizacion",
"cat": "fe",
"tema": "Autorización",
"titulo": "¿Cómo se autoriza un comprobante paso a paso?",
"resumen": "Desde el momento en que el operador presiona 'Grabar', el sistema ejecuta automáticamente estos pasos:",
"kw": "autorizar comprobante flujo proceso cae paso a paso",
"fuentes": [
{
"m": "Manual_Facturacion_Electronica",
"s": "6. Flujo paso a paso del proceso de autorización",
"sub": []
}
],
"secciones": [
{
"g": "que",
"n": "",
"t": "",
"m": "Manual_Facturacion_Electronica",
"sec": "6",
"b": [
{
"t": "p",
"x": "Desde el momento en que el operador presiona 'Grabar', el sistema ejecuta automáticamente estos pasos:"
},
{
"t": "step",
"x": "Verificación del certificado digital"
},
{
"t": "step",
"x": "El sistema verifica si el archivo certificado.crt existe en la carpeta de la empresa."
},
{
"t": "step",
"x": "Si no existe o está vacío, intenta descargarlo automáticamente desde los servidores de Univac.ERP."
},
{
"t": "step",
"x": "Si no puede descargarlo, muestra un error y cancela la autorización. El comprobante NO se graba."
},
{
"t": "step",
"x": "El mismo control se hace para el archivo clave.key."
},
{
"t": "step",
"x": "Login ante ARCA (obtención del Token y Sign)"
},
{
"t": "step",
"x": "El sistema llama al servicio WSAA (Web Service de Autenticación y Autorización) de ARCA."
},
{
"t": "step",
"x": "Usando el certificado y la clave privada, obtiene un Token de seguridad y una Firma (Sign) con validez de 12 horas."
},
{
"t": "step",
"x": "Si este login falla, el proceso se detiene con error 1007 (certificado inválido) o 1009 (no pudo obtener el token)."
},
{
"t": "step",
"x": "Consulta del último comprobante autorizado"
},
{
"t": "step",
"x": "El sistema consulta a ARCA cuál fue el último número de comprobante autorizado para ese tipo y punto de venta."
},
{
"t": "step",
"x": "Al número obtenido le suma 1 para determinar el número del nuevo comprobante."
},
{
"t": "step",
"x": "Si esta consulta falla, el proceso se detiene con error 1001 o 1012."
},
{
"t": "step",
"x": "Armado del XML y envío a ARCA"
},
{
"t": "step",
"x": "El sistema construye el mensaje XML completo con todos los datos del comprobante (cabecera, totales, IVA, tributos, opcionales)."
},
{
"t": "step",
"x": "Lo envía al WebService de ARCA mediante protocolo SOAP sobre HTTPS (TLS 1.2)."
},
{
"t": "step",
"x": "Espera la respuesta hasta 30 segundos. Si no llega respuesta, reintenta (ver sección 10)."
},
{
"t": "step",
"x": "Procesamiento de la respuesta de ARCA"
},
{
"t": "step",
"x": "El sistema interpreta el resultado: A (Aprobado), P (Aprobado con Observaciones), R (Rechazado) o error."
},
{
"t": "step",
"x": "Para A y P: extrae el CAE y su fecha de vencimiento. Calcula el código de barras."
},
{
"t": "step",
"x": "Para R: muestra el motivo del rechazo y NO graba el comprobante."
},
{
"t": "step",
"x": "Grabación definitiva del comprobante"
},
{
"t": "step",
"x": "Solo si ARCA devolvió A o P, el sistema graba el comprobante en la base de datos con el CAE obtenido."
},
{
"t": "step",
"x": "El comprobante queda disponible para impresión, el CAE se imprime en el documento."
}
]
}
],

<script>

(function () {
  'use strict';

  const main = $('#contenido');

  /* =========================================================
     Configuración del asistente.

     con fragmentos literales de los manuales. Para conectar un modelo de IA,

    endpoint: '',

      'No uses conocimiento externo ni de otros ERP. Respetá la terminología del sistema. Si el contexto no alcanza para responder, ' +
      'respondé exactamente: "' + 'No encuentro información suficiente en la documentación disponible para responder esta consulta. ' +

      'El nombre oficial del producto es Univac.ERP.'

  /* ---------- Índices ---------- */
  const CATS = {}; DB.categorias.forEach(c => (CATS[c.id] = c));
  const ARTS = {}; DB.articulos.forEach(a => (ARTS[a.id] = a));
  const inCat = id => DB.articulos.filter(a => a.cat === id || (a.tambien || []).includes(id));

  /* ---------- Utilidades de texto ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = s => esc(s).replace(/'([^'\n]{1,70}?)'/g, '<span class="ui">$1</span>');
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9ñ]+/g, ' ').trim();
  const STOP = new Set(('a al algo algun alguna como con cual cuales cuando de del desde donde dónde e el ella en entre es esa ese eso esta este esto hacer hace hago hay la las le les lo los mas me mi mis muy necesito no o para pero por puedo puede que quiero se segun ser si sin sobre su sus te tengo tiene un una uno unos unas y ya yo ver deseo debo deberia forma manera modo hacerlo cosas favor ayuda univac erp sistema').split(' ').map(norm));
  const stem = w => (w.length > 4 && /es$/.test(w) && !/[aeiou]es$/.test(w) ? w.slice(0, -2) : w.length > 3 && /s$/.test(w) ? w.slice(0, -1) : w);
  const toks = s => norm(s).split(' ').filter(w => w && !STOP.has(w)).map(stem);

  /* Sinónimos de uso cotidiano (no agregan contenido: solo amplían la búsqueda hacia términos del manual). */
  const SYN = [
    'vender venta facturar factura facturacion comprobante',
    'cobrar cobranza cobro recibo',
    'pagar pago orden',
    'stock inventario existencia',
    'precio lista',
    'porcentaje alicuota tasa',
    'borrar eliminar anular baja quitar desactivar',
    'crear alta nuevo agregar cargar registrar emitir generar',
    'modificar editar cambiar corregir actualizar',
    'consultar consulta buscar listado',
    'arca afip',
    'mail correo email',
    'imprimir impresion reimprimir reimpresion',
    'contrasena clave password',
    'dolar usd cotizacion',
    'ecommerce tiendanube mercadolibre woocommerce tienda',
    'deuda saldo debe',
    'error mensaje problema falla rechazado',
    'wayra univac',
    'ingresar login entrar sesion',
    'producto articulo insumo',
    'distinto diferente varios multiple'
  ].map(g => g.split(' ').map(stem));
  const SYNMAP = {};
  SYN.forEach(g => g.forEach(w => (SYNMAP[w] = (SYNMAP[w] || []).concat(g.filter(x => x !== w)))));

  /* ---------- Motor de búsqueda (BM25 simplificado por campos) ---------- */
  function blockText(b) {
    if (b.rows) return b.rows.map(r => r.join(' ')).join(' ');
    return b.x || '';
  }
  const FIELDS = { titulo: 6, kw: 4, tema: 2.5, resumen: 2, head: 2, body: 1 };
  const docs = []; const chunks = [];
  DB.articulos.forEach(a => {
    const head = a.secciones.map(s => s.t).join(' ');
    const body = a.secciones.map(s => s.b.map(blockText).join(' ')).join(' ');
    const f = { titulo: a.titulo, kw: a.kw, tema: a.tema + ' ' + CATS[a.cat].nombre, resumen: a.resumen, head, body };
    const tf = {}; let len = 0;
    for (const k in f) toks(f[k]).forEach(t => { tf[t] = (tf[t] || 0) + FIELDS[k]; len++; });
    docs.push({ a, tf, len, raw: norm(a.titulo + ' ' + a.kw + ' ' + body) });
    a.secciones.forEach((s, i) => {
      const txt = s.t + ' ' + s.b.map(blockText).join(' ');
      const ctf = {}; const tk = toks(txt + ' ' + a.titulo);
      tk.forEach(t => (ctf[t] = (ctf[t] || 0) + 1));
      chunks.push({ a, s, i, tf: ctf, len: tk.length, raw: norm(txt) });
    });
  });
  function mkIdf(list) {
    const df = {}; list.forEach(d => Object.keys(d.tf).forEach(t => (df[t] = (df[t] || 0) + 1)));
    const N = list.length; const idf = {};
    for (const t in df) idf[t] = Math.log(1 + (N - df[t] + 0.5) / (df[t] + 0.5));
    return idf;
  }
  const IDF = mkIdf(docs), CIDF = mkIdf(chunks);
  const VOCAB = Object.keys(IDF);
  const avg = l => l.reduce((s, d) => s + d.len, 0) / l.length;
  const AVG = avg(docs), CAVG = avg(chunks);

  function expand(q) {
    const base = [...new Set(toks(q))];
    return base.map(t => {
      const alts = new Map([[t, 1]]);
      (SYNMAP[t] || []).forEach(s => alts.has(s) || alts.set(s, 0.6));
      if (!IDF[t] && t.length >= 4) VOCAB.forEach(v => { if (v.startsWith(t) && !alts.has(v)) alts.set(v, 0.7); });
      if (!IDF[t] && t.length >= 5) VOCAB.forEach(v => { if (t.startsWith(v) && v.length >= 4 && !alts.has(v)) alts.set(v, 0.6); });
      return { t, alts };
    });
  }
  function score(list, idf, avgl, q) {
    const terms = expand(q); if (!terms.length) return { terms, res: [] };
    const nq = norm(q);
    const res = list.map(d => {
      let sc = 0, hit = 0;
      terms.forEach(({ alts }) => {
        let best = 0;
        alts.forEach((w, term) => {
          const f = d.tf[term]; if (!f) return;
          const s = (idf[term] || 0) * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * d.len / avgl)) * w;
          if (s > best) best = s;
        });
        if (best > 0) hit++;
        sc += best;
      });
      if (nq.split(' ').length > 1 && d.raw.includes(nq)) sc *= 1.5;
      return { d, sc, cov: hit / terms.length };
    }).filter(r => r.sc > 0);
    res.sort((x, y) => y.sc - x.sc || y.cov - x.cov);
    return { terms, res };
  }
  function search(q) {
    const { terms, res } = score(docs, IDF, AVG, q);
    const need = terms.length <= 2 ? 1 : terms.length <= 4 ? 0.6 : 0.5;
    return { terms, res: res.filter(r => r.cov >= need - 1e-9) };
  }

  /* ---------- Render de bloques ---------- */
  function renderBlocks(bl) {
    let h = '', i = 0;
    while (i < bl.length) {
      const b = bl[i];
      if (b.t === 'step' || b.t === 'li') {
        const t = b.t; const tag = t === 'step' ? 'ol class="steps"' : 'ul';
        h += '<' + tag + '>';
        while (i < bl.length && bl[i].t === t) { h += '<li>' + fmt(bl[i].x) + '</li>'; i++; }
        h += t === 'step' ? '</ol>' : '</ul>';
        continue;
      }
      if (b.t === 'p') h += '<p>' + fmt(b.x) + '</p>';
      else if (b.t === 'h3') h += '<h4>' + fmt(b.x) + '</h4>';
      else if (b.t === 'call') {
        const lab = { warn: 'Atención', error: 'Importante', info: 'Información', ok: 'Correcto', tip: 'Sugerencia' }[b.k] || 'Nota';
        h += '<div class="notice ' + esc(b.k || '') + '"><span class="k">' + lab + '</span>' + fmt(b.x.replace(/^[ℹ⚠✖✔✓💡]\s*/u, '')) + '</div>';
      } else if (b.t === 'table' && b.rows.length) {
        const [hd, ...rows] = b.rows;
        const single = !rows.length;
        h += '<div class="tbl"><table>' + (single ? '' : '<thead><tr>' + hd.map(c => '<th>' + fmt(c) + '</th>').join('') + '</tr></thead>') +
          '<tbody>' + (single ? [hd] : rows).map(r => '<tr>' + r.map(c => '<td>' + fmt(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      }
      i++;
    }
    return h;
  }
  const srcLabel = s => s.m + ' — ' + (s.n ? 'sección ' + s.n : 'sección ' + (s.sec || '')) + (s.t ? ' «' + s.t + '»' : '');

  /* ---------- Vistas ---------- */
  function setActive(cat) {

  }

  const EXAMPLES = ['IVA por alícuota', '¿Cómo hago una venta con diferentes porcentajes de IVA?', 'anular factura', 'cheques de terceros', 'importar precios desde Excel', 'error 1007'];

      '<div class="examples">Ejemplos: ' + EXAMPLES.map(e => '<button class="chip" data-q="' + esc(e) + '">' + esc(e) + '</button>').join('') + '</div></section>' +

  }

  function viewCat(id) {

    setActive(id);

    list.forEach(a => { const t = a.cat === id ? a.tema : 'Relacionados de otros módulos'; (temas[t] = temas[t] || []).push(a); });
    const order = Object.keys(temas).sort((x, y) => (x === 'Relacionados de otros módulos') - (y === 'Relacionados de otros módulos'));
    main.innerHTML = crumbs([['Inicio', '#/'], [c.nombre]]) +

      order.map(t => '<section class="topic"><h2>' + esc(t) + '</h2><ul class="art-list">' + temas[t].map(artItem).join('') + '</ul></section>').join('');
  }
  const artItem = a => '<li><a href="#/articulo/' + a.id + '"><span class="t">' + esc(a.titulo) +
    (a.restringido ? '<span class="tag res">Uso restringido</span>' : '') + (a.revision ? '<span class="tag rev">En revisión</span>' : '') +

  const GROUPS = [
    ['que', '¿Qué es y para qué sirve?'], ['donde', '¿Dónde se encuentra?'], ['pasos', '¿Cómo se hace?'],
    ['detalle', 'Detalle de la pantalla'], ['consid', 'Consideraciones'], ['ejemplo', 'Ejemplo práctico'], ['relacion', 'Relación con otros módulos']

  function viewArticle(id) {

      (caps || '<div class="media-slot"><b>Capturas de pantalla</b>Espacio reservado para capturas reales del sistema.</div>') +

      '<h1>' + esc(a.titulo) + '</h1>' + (a.resumen ? '<p class="lead">' + fmt(a.resumen) + '</p>' : '') +
      '<div class="meta"><span>Módulo: <b>' + esc(c.nombre) + '</b></span><span>Tema: <b>' + esc(a.tema) + '</b></span><span>Fuente: <b>' + esc([...new Set(a.fuentes.map(f => f.m))].join(', ')) + '</b></span>' +
      (a.ultimaRevision ? '<span>Revisión: <b>' + esc(a.ultimaRevision) + '</b></span>' : '') + '</div>' +
      restr + rev + body +

  function related(a) {
    const out = (a.relacionados || []).map(id => ARTS[id]).filter(Boolean);
    if (out.length < 4) {

  function snippet(a, terms) {

  /* ---------- Asistente documental ---------- */
  const chatLog = [];
  function intent(q) {
    const n = norm(q);
    if (/^(que es|que son|para que)/.test(n)) return ['que', 'detalle'];
    if (/^(donde|en que menu|como accedo|como entro)/.test(n)) return ['donde', 'pasos'];
    if (/(error|mensaje|no me deja|no puedo|problema|rechaz)/.test(n)) return ['consid', 'detalle'];
    if (/^(como|pasos|que tengo que hacer)/.test(n)) return ['pasos', 'donde'];
    return [];
  }
  function localAnswer(q) {
    const { terms, res } = search(q);
    if (!terms.length || !res.length) return null;
    const top = res[0];
    const need = terms.length <= 2 ? 1 : 0.6;
    if (top.cov < need) return null;
    const pref = intent(q);
    const cr = score(chunks.filter(c => c.a.id === top.d.a.id), CIDF, CAVG, q).res;
    let pick = [];
    pref.forEach(g => { const c = cr.find(x => x.d.s.g === g); if (c && !pick.includes(c)) pick.push(c); });
    cr.forEach(c => { if (pick.length < 2 && !pick.includes(c)) pick.push(c); });
    pick = pick.slice(0, 2).sort((x, y) => x.d.i - y.d.i);
    const second = res.slice(1, 6).filter(r => r.cov >= need && r.sc >= top.sc * 0.45).slice(0, 3).map(r => r.d.a);
    const bestC = cr.length ? cr[0].sc : 0;
    const globalC = score(chunks, CIDF, CAVG, q).res.filter(c => c.d.a.id !== top.d.a.id && c.cov >= 0.99 && c.sc >= bestC).slice(0, 1);
    return { art: top.d.a, pick: pick.map(p => p.d), extra: globalC.map(c => c.d), also: second };
  }
  function answerHTML(r) {
    if (!r) return '<p>' + esc(SIN_INFO) + '</p>';
    const a = r.art; const parts = r.pick.concat(r.extra);
    const srcs = [...new Map(parts.map(p => [p.s.m + p.s.n + p.s.t, p.s])).values()];
    return '<h4>' + esc(a.titulo) + '</h4>' + (a.resumen ? '<p>' + fmt(a.resumen) + '</p>' : '') +
      r.pick.map(p => subHTML(p.s)).join('') +
      r.extra.map(p => '<p class="small">También en <a href="#/articulo/' + p.a.id + '">' + esc(p.a.titulo) + '</a>:</p>' + subHTML(p.s)).join('') +
      '<p><a href="#/articulo/' + a.id + '">Ver el artículo completo ›</a></p>' +
      (r.also.length ? '<div class="also">Artículos que también pueden servirte: ' + r.also.map(x => '<a href="#/articulo/' + x.id + '">' + esc(x.titulo) + '</a>').join(' · ') + '</div>' : '') +
      '<div class="srcs"><b>Fuente' + (srcs.length > 1 ? 's' : '') + ':</b>' + srcs.map(s => '<div>' + esc(srcLabel(s)) + '</div>').join('') + '</div>';
  }
  async function ask(q) {
    const local = localAnswer(q);
    if (ASISTENTE_IA.endpoint && local) {
      try {
        const contexto = local.pick.concat(local.extra).map(p => ({ fuente: srcLabel(p.s), articulo: p.a.titulo, texto: p.s.b.map(blockText).join('\n') }));
        const resp = await fetch(ASISTENTE_IA.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pregunta: q, contexto, instrucciones: ASISTENTE_IA.instrucciones }) });
        if (resp.ok) {
          const j = await resp.json();
          if (j && j.respuesta) return '<p>' + fmt(j.respuesta).replace(/\n/g, '<br>') + '</p><div class="srcs"><b>Fuentes:</b>' + contexto.map(c => '<div>' + esc(c.fuente) + '</div>').join('') + '</div>';
        }
      } catch (e) { /* si el servicio no responde, se usa la respuesta documental local */ }
    }
    return answerHTML(local);
  }
  function viewAssistant() {
    setActive(null);
    main.innerHTML = '<div class="assist">' + crumbs([['Inicio', '#/'], ['Asistente']]) +
      '<div class="page-h"><h1>Asistente de documentación</h1><p>Respuestas construidas exclusivamente con los manuales oficiales de Univac.ERP. Si la documentación no cubre tu consulta, te lo indicará.</p></div>' +
      '<div class="mode"><i></i>' + (ASISTENTE_IA.endpoint ? 'IA conectada · limitada a la documentación' : 'Modo búsqueda documental: responde con fragmentos literales de los manuales') + '</div>' +
      '<div class="chat"><div class="chat-log" id="chatLog" aria-live="polite"></div>' +
      '<form class="chat-form" id="chatForm"><textarea id="chatQ" placeholder="Escribí tu consulta, por ejemplo: ¿Cómo registro una cobranza?" aria-label="Consulta"></textarea><button>Enviar</button></form></div>' +
      '<p class="small">Ejemplos: ' + EXAMPLES.slice(0, 4).map(e => '<button class="chip" data-q="' + esc(e) + '">' + esc(e) + '</button>').join(' ') + '</p></div>';
    const log = $('#chatLog');
    const paint = () => {
      log.innerHTML = chatLog.length ? chatLog.map(m => '<div class="msg ' + m.r + '">' + m.h + '</div>').join('') :
        '<div class="msg bot"><p>Hola. Soy el asistente del Centro de Ayuda de Univac.ERP. Consultame sobre cualquier función documentada del sistema.</p></div>';
      log.scrollTop = log.scrollHeight;
    };
    const send = async q => {
      q = q.trim(); if (!q) return;
      chatLog.push({ r: 'user', h: esc(q) }); paint();
      chatLog.push({ r: 'bot', h: await ask(q) }); paint();
    };
    $('#chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#chatQ').value; $('#chatQ').value = ''; send(v); });
    $('#chatQ').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chatForm').requestSubmit(); } });
    main.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => send(b.dataset.q)));
    paint(); $('#chatQ').focus();
  }

  function viewSources() {
    setActive(null);
    const per = {}; DB.articulos.forEach(a => a.fuentes.forEach(f => (per[f.m] = (per[f.m] || new Set()).add(a.id))));
    main.innerHTML = crumbs([['Inicio', '#/'], ['Fuentes y alcance']]) +
      '<div class="page-h"><h1>Fuentes y alcance</h1><p>Todo el contenido de este Centro de Ayuda proviene exclusivamente de los siguientes manuales oficiales. Univac.ERP es el nombre actual del sistema anteriormente denominado Wayra ERP.</p></div>' +
      Object.keys(DB.manuales).map(m => '<div class="manual-row"><span><b>' + esc(m) + '</b></span><span class="small">' + (per[m] ? per[m].size : 0) + ' artículos</span></div>').join('') +
      '<p class="small" style="margin-top:20px">Las capturas de pantalla y los videos se incorporarán a medida que estén disponibles. Ningún artículo contiene imágenes ni enlaces que no hayan sido provistos oficialmente.</p>';
  }
  function viewReview() {
    setActive(null);
    const items = DB.articulos.filter(a => a.revision);
    const byT = {}; items.forEach(a => a.revision.forEach(r => { (byT[r.texto] = byT[r.texto] || { r, arts: [] }).arts.push(a); }));
    main.innerHTML = crumbs([['Inicio', '#/'], ['Observaciones de documentación']]) +
      '<div class="page-h"><h1>Observaciones de documentación</h1><p>Diferencias detectadas entre manuales. No se unificaron: se muestran tal como figuran en cada fuente hasta su revisión por el equipo de Univac.</p></div>' +
      Object.values(byT).map(o => '<div class="notice review"><span class="k">' + esc(o.r.titulo) + '</span>' + fmt(o.r.texto) +
        '<div class="small" style="margin-top:8px">Artículos afectados: ' + o.arts.map(a => '<a href="#/articulo/' + a.id + '">' + esc(a.titulo) + '</a>').join(' · ') + '</div></div>').join('');
  }
  function viewNotFound() {
    main.innerHTML = '<div class="empty"><h2>Página no encontrada</h2><p>El contenido solicitado no existe.</p><p><a href="#/">Volver al inicio</a></p></div>';
  }

  /* ---------- Router ---------- */
  function go(h) { if (location.hash === h) route(); else location.hash = h; }
  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    const [v, p, anchor] = parts.map(x => decodeURIComponent(x || ''));
    closeMenu();
    if (!v) viewHome();
    else if (v === 'modulo') viewCat(p);
    else if (v === 'articulo') viewArticle(p);
    else if (v === 'buscar') viewSearch(parts.slice(1).map(decodeURIComponent).join('/'));
    else if (v === 'asistente') viewAssistant();
    else if (v === 'fuentes') viewSources();
    else if (v === 'revision') viewReview();
    else viewNotFound();
    const el = anchor && document.getElementById(anchor);
    if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
    document.title = (($('h1', main) || {}).textContent || 'Inicio') + ' | Centro de Ayuda Univac.ERP';
  }

  /* ---------- Menú móvil y atajos ---------- */
  const side = $('#sidebar'), scrim = $('#scrim'), btn = $('#btnMenu');
  function closeMenu() { side.classList.remove('open'); scrim.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', () => { const o = !side.classList.contains('open'); side.classList.toggle('open', o); scrim.hidden = !o; btn.setAttribute('aria-expanded', String(o)); });
  scrim.addEventListener('click', closeMenu);
  $('#topSearch').addEventListener('submit', e => { e.preventDefault(); go('#/buscar/' + encodeURIComponent($('#topQ').value)); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); $('#topQ').focus(); }
    if (e.key === 'Escape') closeMenu();
  });

  renderSide();
  window.addEventListener('hashchange', route);
  route();
  window.UnivacAyuda = { search: q => search(q).res.map(r => r.d.a.id), ask: q => localAnswer(q) };
})();

</script>
</body>
</html>
